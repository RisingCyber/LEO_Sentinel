name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m py_compile leo_sentinel.py

      - name: CLI smoke test (no network — help/version/taxonomy only)
        run: |
          python leo_sentinel.py --version
          python leo_sentinel.py --help
          python leo_sentinel.py --list-mission-classes

      - name: Run test suite
        run: pytest -v
